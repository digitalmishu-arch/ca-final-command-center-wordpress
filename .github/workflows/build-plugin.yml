name: Test and build WordPress plugin
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        legacy: ['0', '1']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and WordPress database/security integration tests
        run: bash tests/run-integration.sh
        env:
          CAFCC_TEST_LEGACY: ${{ matrix.legacy }}
      - name: Check JavaScript syntax
        run: |
          for asset in ca-final-command-center/assets/*.js; do node --check "$asset"; done
      - name: Build installable ZIP
        if: matrix.legacy == '0'
        run: python3 scripts/build.py
      - name: Upload downloadable plugin
        if: matrix.legacy == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ca-final-command-center-0.5.3
          path: dist/ca-final-command-center.zip
          if-no-files-found: error
          retention-days: 30
  browser-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools on the CI runner only
        run: |
          python3 -m pip install playwright==1.56.0 openpyxl==3.1.5
          python3 -m playwright install --with-deps chromium webkit
      - name: Explorer, Studio, Excel, registration and private-practice browser regressions
        run: CAFCC_TEST_WEBKIT=1 bash tests/run-browser.sh
      - uses: actions/upload-artifact@v4
        with:
          name: v052-authored-browser-previews
          path: |
            docs/previews/v04-*.png
            docs/previews/v041-*.png
            docs/previews/v05-*.png
            docs/previews/v051-*.png
            docs/previews/v052-*.png
          if-no-files-found: error
          retention-days: 30
